name: render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id"
        required: true
        type: string
      resume_url:
        description: "n8n resume URL"
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      JOB_ID: ${{ inputs.job_id }}
      RESUME_URL: ${{ inputs.resume_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install requests piper-tts
          python -c "import piper; print('piper import ok')"

      - name: Make Hindi voice
        run: python make_voice.py "jobs/${JOB_ID}"

      - name: Render video
        run: python render.py "jobs/${JOB_ID}"

      - name: Check final video
        run: |
          test -s "jobs/${JOB_ID}/final.mp4"
          test -s "jobs/${JOB_ID}/result.json"

      - name: Commit final video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "jobs/${JOB_ID}/final.mp4"
          git diff --cached --quiet || git commit -m "Render ${JOB_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Tell n8n it worked
        if: success() && env.RESUME_URL != ''
        run: curl -fsS -X POST -H "Content-Type: application/json" --data @"jobs/${JOB_ID}/result.json" "$RESUME_URL"

      - name: Tell n8n it failed
        if: failure() && env.RESUME_URL != ''
        run: |
          python - <<'PY'
          import json, os
          url = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          json.dump({'job_id': os.environ['JOB_ID'], 'ok': False, 'error': 'Render job failed. See ' + url}, open('fail.json', 'w'))
          PY
          curl -sS -X POST -H "Content-Type: application/json" --data @fail.json "$RESUME_URL" || true

name: render

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id"
        required: true
        type: string
      resume_url:
        description: "n8n resume URL"
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      JOB_ID: ${{ inputs.job_id }}
      RESUME_URL: ${{ inputs.resume_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          pip install pillow requests

      - name: Make Hindi voice
        run: python make_voice.py "jobs/${JOB_ID}"

      - name: Render video
        run: python render.py "jobs/${JOB_ID}"

      - name: Check final video
        run: |
          test -f "jobs/${JOB_ID}/final.mp4"
          test -s "jobs/${JOB_ID}/final.mp4"

      - name: Commit final video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "jobs/${JOB_ID}/final.mp4"
          git diff --cached --quiet || git commit -m "Render ${JOB_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Tell n8n it worked
        if: success() && env.RESUME_URL != ''
        run: |
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            --data "{\"job_id\":\"${JOB_ID}\",\"ok\":true}" \
            "$RESUME_URL"

      - name: Tell n8n it failed
        if: failure() && env.RESUME_URL != ''
        run: |
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            --data "{\"job_id\":\"${JOB_ID}\",\"ok\":false,\"error\":\"Render job failed; check GitHub Actions logs\"}" \
            "$RESUME_URL" || true
